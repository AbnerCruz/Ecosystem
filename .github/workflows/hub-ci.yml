name: hub-ci

# CI do Hub no monorepo: só testes, sem assinatura e sem publicar. Roda apenas quando o Hub muda (NN-014).
# O job `android` prova que a camada de UI (P3-9) compila e gera um APK de depuração com a assinatura de desenvolvimento estável; a publicação da release está em hub-release.yml (P3-7).

on:
  push:
    branches: [main]
    paths: ['apps/hub/**', '.github/workflows/hub-ci.yml']
  pull_request:
    paths: ['apps/hub/**', '.github/workflows/hub-ci.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit a testar (o integrador passa o estado combinado main + PR; ADR-0015)'
        type: string
        required: false
        default: ''

concurrency:
  group: hub-ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hub
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test (Hub.Core)
        run: dotnet test --project tests/Hub.Tests

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build APK (depuração)
        run: >
          dotnet build apps/hub/src/Hub.Android/Hub.Android.csproj -c Debug
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:GITHUB_RUN_NUMBER=${{ github.run_number }}
      - name: Collect APK
        run: |
          apk=$(find apps/hub/src/Hub.Android/bin -name '*-Signed.apk' | head -n1)
          test -n "$apk" || { echo "APK assinado não encontrado"; find apps/hub/src/Hub.Android/bin -name '*.apk'; exit 1; }
          mkdir -p dist
          cp "$apk" dist/hub-debug.apk
          ls -l dist/hub-debug.apk
      - name: Verificar o certificado (chave de desenvolvimento estável, DEC-0029-A)
        run: |
          expected=$(tr -d '[:space:]' < apps/hub/tools/hub-dev.keystore.sha256)
          keytool -printcert -jarfile dist/hub-debug.apk | grep -E "Owner|SHA256"
          keytool -printcert -jarfile dist/hub-debug.apk | grep -q "SHA256: $expected" || { echo "APK não está assinado com a chave de desenvolvimento estável do Hub"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: hub-debug-apk
          path: dist/hub-debug.apk
          if-no-files-found: error
