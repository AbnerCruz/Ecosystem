name: pages

# Publica o portal web (site/) no GitHub Pages — ADR-0005, docs/architecture/portal.md.
# Independente do workflow de consistência: uma falha aqui não bloqueia desenvolvimento nem produtos.
# Pré-requisito: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4

      # Evita "deploy verde" enquanto o Pages continua servindo a publicação legada da branch.
      # A API é a fonte observável do modo efetivo; a UI de Settings sozinha não basta como evidência.
      - name: Verify Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          echo "GitHub Pages build_type=${build_type}"
          if [ "${build_type}" != "workflow" ]; then
            echo "::error title=GitHub Pages source incorreta::A API informa build_type='${build_type}'. Em Settings > Pages, Source precisa ser GitHub Actions."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Consistency checks (fontes canônicas)
        run: dotnet run tests/consistency/Check.cs

      - name: Generate projection
        run: >
          dotnet run site/generator/GenerateStatus.cs --
          --ref "${{ github.event.repository.default_branch }}"
          --commit "${{ github.sha }}"
          --checks passing
          --checks-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Validate projection (CHK-PORTAL)
        run: dotnet run tests/consistency/Check.cs

      - name: Assemble and verify site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude generator/ site/ _site/

          test -s _site/index.html
          test -s _site/app.js
          test -s _site/style.css
          test -s _site/data/ecosystem-status.json
          test ! -e _site/README.md

          # O artefato é estático e deve chegar ao Pages sem processamento Jekyll.
          touch _site/.nojekyll

          echo "Pages artifact:"
          find _site -maxdepth 2 -type f -printf '%P\n' | sort
          grep -Fq '<title>Ecosystem — Portal</title>' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify live portal
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Pages URL and verify portal entrypoint
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          echo "Checking ${PAGE_URL}"
          for attempt in {1..12}; do
            body="$(curl -fsSL --max-time 20 "${PAGE_URL}?commit=${GITHUB_SHA}" || true)"
            if printf '%s' "${body}" | grep -Fq '<title>Ecosystem — Portal</title>'; then
              echo "Live portal verified on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: expected portal entrypoint not visible yet."
            sleep 5
          done

          echo "::error title=GitHub Pages serving unexpected content::The public URL did not serve site/index.html after deployment."
          exit 1
