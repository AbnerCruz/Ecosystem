name: lunet2d-ci

# CI do Lunet2D no monorepo: só testes, sem assinatura e sem publicar. Roda apenas quando o produto muda (NN-014).
# As releases continuam sendo construídas e publicadas pela origem (DEC-0008-A; plano §7). Espelha o job 'test' do ci.yml
# do produto (apps/lunet2d/.github/workflows/ci.yml, inerte).

on:
  push:
    branches: [main]
    paths: ['apps/lunet2d/**', 'platform/text-inspection/**', '.github/workflows/lunet2d-ci.yml']
  pull_request:
    paths: ['apps/lunet2d/**', 'platform/text-inspection/**', '.github/workflows/lunet2d-ci.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit a testar (o integrador passa o estado combinado main + PR; ADR-0015)'
        type: string
        required: false
        default: ''

concurrency:
  group: lunet2d-ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lunet2d
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check Text Inspection projections
        run: dotnet run ../../platform/text-inspection/tools/Projection.cs -- --check
      - name: Self-test Text Inspection projection enforcement
        run: dotnet run ../../platform/text-inspection/tools/Projection.cs -- --self-test
      - name: Test Text Inspection Core
        run: cd ../../platform/text-inspection && dotnet test --project tests/Ecosystem.TextInspection.Tests/Ecosystem.TextInspection.Tests.csproj
      - name: Test (framework, compiler, runtime, projects, architecture)
        run: dotnet test --project tests/Lunet.Tests
