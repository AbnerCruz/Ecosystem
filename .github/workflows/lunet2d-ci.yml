name: lunet2d-ci

# CI do Lunet2D no monorepo: só testes, sem assinatura e sem publicar. Roda apenas quando o produto muda (NN-014).
# As releases continuam sendo construídas e publicadas pela origem (DEC-0008-A; plano §7). Espelha o job 'test' do ci.yml
# do produto (apps/lunet2d/.github/workflows/ci.yml, inerte).

on:
  push:
    branches: [main]
    paths: ['apps/lunet2d/**', 'platform/text-inspection/**', '.github/workflows/lunet2d-ci.yml']
  pull_request:
    paths: ['apps/lunet2d/**', 'platform/text-inspection/**', '.github/workflows/lunet2d-ci.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit a testar (o integrador passa o estado combinado main + PR; ADR-0015)'
        type: string
        required: false
        default: ''

concurrency:
  group: lunet2d-ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lunet2d
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check shared Agent Runtime projection
        run: python3 ../../platform/agent-runtime/projection.py
      - name: Check Text Inspection projections
        run: dotnet run ../../platform/text-inspection/tools/Projection.cs -- --check
      - name: Self-test Text Inspection projection enforcement
        run: dotnet run ../../platform/text-inspection/tools/Projection.cs -- --self-test
      - name: Test Text Inspection Core
        run: cd ../../platform/text-inspection && dotnet test --project tests/Ecosystem.TextInspection.Tests/Ecosystem.TextInspection.Tests.csproj
      - name: Test (framework, compiler, runtime, projects, architecture)
        run: dotnet test --project tests/Lunet.Tests
      - name: Test Release (framework, compiler, runtime, projects, architecture)
        run: dotnet test --project tests/Lunet.Tests -c Release
      # ADR 0013: every change of the Avalonia shell ships headless captures (phone and wide widths). Not a device test.
      - name: Capture the Lunet.Client shell (headless Skia)
        run: dotnet run --project src/Lunet.Desktop -- --screens "$RUNNER_TEMP/lunet-shell-screens"
      - name: Capture the procedural game sample (headless)
        env:
          LUNET_RANDOM_CAPTURE: ${{ runner.temp }}/lunet-shell-screens/random-coins.png
        run: dotnet tests/Lunet.Tests/bin/Release/net10.0/Lunet.Tests.dll -method '*SampleRendersRepeatableCoinsCellsAndCircleThroughThePreviewBackend*'
      - uses: actions/upload-artifact@v4
        with:
          name: lunet-shell-screens
          path: ${{ runner.temp }}/lunet-shell-screens/*.png
          if-no-files-found: error

  random-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/lunet2d
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build framework and tests (Release)
        run: dotnet build tests/Lunet.Tests -c Release
      - name: Compare RNG and Philox vectors on Windows x64
        run: dotnet tests/Lunet.Tests/bin/Release/net10.0/Lunet.Tests.dll -class Lunet.Tests.LunetRandomTests
