name: lunet2d-release

on:
  push:
    branches: [main]
    paths: ['apps/lunet2d/**', 'platform/text-inspection/**', '.github/workflows/lunet2d-release.yml']
  pull_request:
    paths: ['apps/lunet2d/**', 'platform/text-inspection/**', '.github/workflows/lunet2d-release.yml']
  workflow_dispatch:

concurrency:
  group: lunet2d-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lunet2d
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check Text Inspection projections
        run: dotnet run ../../platform/text-inspection/tools/Projection.cs -- --check
      - name: Test Text Inspection Core
        run: cd ../../platform/text-inspection && dotnet test --project tests/Ecosystem.TextInspection.Tests/Ecosystem.TextInspection.Tests.csproj
      - name: Test (framework, compiler, runtime, projects, architecture)
        run: dotnet test --project tests/Lunet.Tests

  apk:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lunet2d
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      # Only Lunet's development/release pipeline builds the runtime. Users never need an SDK,
      # GitHub account or network to export their own games from the shipped APK.
      - name: Build reusable standalone game host
        run: |
          dotnet build runtime-template/Lunet.GameCode.csproj -c Release \
            -p:GameSourceRoot="$PWD/samples/apk-smoke"
          dotnet build runtime-template/Lunet.Game.Android.csproj -c Release \
            -p:GameSourceRoot="$PWD/samples/apk-smoke" \
            -p:ApplicationId=io.lunet.game.smoke \
            -p:AndroidSdkDirectory="$ANDROID_HOME"
          template=$(find runtime-template/bin -name '*-Signed.apk' | head -n1)
          test -n "$template" || { echo "Standalone runtime template missing"; exit 1; }
          mkdir -p dist/template
          cp "$template" dist/template/game-runtime.apk
      - name: Validate offline APK packaging and v2 certificate
        run: |
          game=$(find runtime-template/bin -name 'CompiledGame.dll' | head -n1)
          test -f "$game"
          dotnet run --project tools/offline-apk-check/OfflineApkCheck.csproj -- \
            dist/template/game-runtime.apk "$game" dist/template/offline-smoke.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n1)
          zipalign=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n1)
          test -n "$apksigner" && test -n "$aapt" && test -n "$zipalign"
          # Signature verification is NOT enough: Android 11+ rejects an unaligned
          # resources.arsc even if apksigner accepts the v2 signature.
          "$zipalign" -c -v 4 dist/template/offline-smoke.apk
          "$apksigner" verify --verbose --min-sdk-version 29 dist/template/offline-smoke.apk
          "$aapt" dump badging dist/template/offline-smoke.apk | grep -q "package: name='io.lunet.game.offline.smoketest'"
          dotnet run --project tools/offline-apk-check/OfflineApkCheck.csproj -- \
            dist/template/game-runtime.apk "$game" dist/template/offline-landscape.apk \
            io.lunet.game.offline.landscape landscape
          "$zipalign" -c -v 4 dist/template/offline-landscape.apk
          "$apksigner" verify --verbose --min-sdk-version 29 dist/template/offline-landscape.apk
          "$aapt" dump badging dist/template/offline-landscape.apk | grep -q "package: name='io.lunet.game.offline.landscape'"
          "$aapt" dump xmltree dist/template/offline-smoke.apk AndroidManifest.xml |
            grep -F 'io.lunet.game.offline.smoketest.mono.MonoRuntimeProvider.__mono_init__'
          "$aapt" dump xmltree dist/template/offline-landscape.apk AndroidManifest.xml |
            grep -F 'io.lunet.game.offline.landscape.mono.MonoRuntimeProvider.__mono_init__'
          echo "Orientações encontradas no AXML (ARM64):"
          "$aapt" dump xmltree dist/template/offline-smoke.apk AndroidManifest.xml | grep -i 'screenOrientation'
          "$aapt" dump xmltree dist/template/offline-landscape.apk AndroidManifest.xml | grep -i 'screenOrientation'
          "$aapt" dump xmltree dist/template/offline-smoke.apk AndroidManifest.xml | grep -F 'screenOrientation(0x0101001e)=(type 0x10)0x1'
          "$aapt" dump xmltree dist/template/offline-landscape.apk AndroidManifest.xml | grep -F 'screenOrientation(0x0101001e)=(type 0x10)0x0'
      # The production game template is ARM64, but an x86_64 emulator exercises
      # the SAME offline packager through the Android package manager. A valid
      # signature and resources table alone do not prove installability.
      - name: Build x86_64 install smoke with the offline game packager
        run: |
          dotnet build runtime-template/Lunet.Game.Android.csproj -c Release \
            -p:RuntimeIdentifier=android-x64 \
            -p:GameSourceRoot="$PWD/samples/apk-smoke" \
            -p:ApplicationId=io.lunet.game.smoke \
            -p:AndroidSdkDirectory="$ANDROID_HOME"
          template=$(find runtime-template/bin/Release/net10.0-android/android-x64 -name '*-Signed.apk' | head -n1)
          test -f "$template" || { echo "Missing Android x86_64 standalone template"; exit 1; }
          game=$(find runtime-template/bin -name 'CompiledGame.dll' | head -n1)
          dotnet run --project tools/offline-apk-check/OfflineApkCheck.csproj -- \
            "$template" "$game" dist/template/offline-portrait-x64.apk \
            io.lunet.game.offline.portrait portrait
          dotnet run --project tools/offline-apk-check/OfflineApkCheck.csproj -- \
            "$template" "$game" dist/template/offline-landscape-x64.apk \
            io.lunet.game.offline.landscape landscape
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n1)
          "$aapt" dump xmltree dist/template/offline-portrait-x64.apk AndroidManifest.xml | grep -F 'screenOrientation(0x0101001e)=(type 0x10)0x1'
          "$aapt" dump xmltree dist/template/offline-landscape-x64.apk AndroidManifest.xml | grep -F 'screenOrientation(0x0101001e)=(type 0x10)0x0'
      - name: Enable KVM for Android installability smoke
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install exported game on Android 13 (API 33)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          script: |
            adb install -r apps/lunet2d/dist/template/offline-portrait-x64.apk
            adb install -r apps/lunet2d/dist/template/offline-landscape-x64.apk
            adb shell pm path io.lunet.game.offline.portrait | grep -q 'package:'
            adb shell pm path io.lunet.game.offline.landscape | grep -q 'package:'
            # Both apps must coexist; neither may overwrite the other.
            adb shell pm list packages | grep -q 'package:io.lunet.game.offline.portrait'
            adb shell pm list packages | grep -q 'package:io.lunet.game.offline.landscape'
      - name: Build APK
        run: >
          dotnet build src/Lunet.Android/Lunet.Android.csproj -c Debug
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:GITHUB_RUN_NUMBER=$((1000000 + ${{ github.run_number }}))
      - name: Collect APK
        run: |
          apk=$(find src/Lunet.Android/bin -name '*-Signed.apk' | head -n1)
          test -n "$apk" || { echo "APK assinado não encontrado"; find src/Lunet.Android/bin -name '*.apk'; exit 1; }
          mkdir -p dist
          cp "$apk" dist/lunet.apk
          echo "Certificado de assinatura do APK (deve ser igual em todas as builds):"
          keytool -printcert -jarfile dist/lunet.apk | grep -E "Owner|SHA256"
          expected="48:07:F9:08:0B:F5:53:5D:20:73:44:76:E3:E3:BC:9F:E6:44:6C:70:E3:84:77:14:86:E6:AC:33:3E:DD:92:07"
          keytool -printcert -jarfile dist/lunet.apk | grep -q "SHA256: $expected" || { echo "APK não está assinado com a chave de desenvolvimento estável"; exit 1; }
      - uses: actions/upload-artifact@v6
        with:
          name: lunet-apk
          path: apps/lunet2d/dist/lunet.apk
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lunet2d
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: lunet-apk
          path: apps/lunet2d/dist
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="lunet2d-v$(tr -d '[:space:]' < VERSION)-dev.$((1000000 + ${{ github.run_number }}))"
          tools/make-release-files.sh dist/lunet.apk "${tag#lunet2d-v}" development "${{ github.sha }}" out
          gh release view "$tag" >/dev/null 2>&1 && exit 0
          gh release create "$tag" out/* --target "${{ github.sha }}" --prerelease --latest=false \
            --title "Lunet ${tag#lunet2d-v} (development)" --notes-file out/release-notes.md
