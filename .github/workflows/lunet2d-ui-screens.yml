name: lunet2d-ui-screens

# LUNET-483: every UI change of the Lunet IDE gets real emulator screenshots (visual review, not blind UI).
on:
  pull_request:
    paths: ['apps/lunet2d/src/Lunet.Android/**', 'apps/lunet2d/tools/ci-ui-screens.sh', '.github/workflows/lunet2d-ui-screens.yml']
  workflow_dispatch:

concurrency:
  group: lunet2d-ui-screens-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  screens:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build IDE (x86_64, UI demo harness)
        working-directory: apps/lunet2d
        run: >
          dotnet build src/Lunet.Android/Lunet.Android.csproj -c Debug
          -p:RuntimeIdentifier=android-x64 -p:LunetUiDemo=true
          -p:AndroidSdkDirectory="$ANDROID_HOME"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture screens on Android 13 (Pixel-class phone)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: bash apps/lunet2d/tools/ci-ui-screens.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lunet-ui-screens
          path: apps/lunet2d/dist/ui-screens
          if-no-files-found: warn
