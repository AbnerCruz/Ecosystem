name: p5-4-device-release

on:
  push:
    branches: [chatgpt/p5-4-publish-browser-apks]
    paths:
      - '.github/workflows/p5-4-device-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artifacts exatos do candidato v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11312763467/zip" > hub.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11313835032/zip" > lunet.zip
          mkdir hub lunet out
          unzip -q hub.zip -d hub
          unzip -q lunet.zip -d lunet

          hub_apk=$(find hub -type f -name '*.apk' | head -n1)
          lunet_apk=$(find lunet -type f -name '*.apk' | head -n1)
          test -n "$hub_apk"
          test -n "$lunet_apk"

          cp "$hub_apk" out/Ecosystem-Hub-P5-4-v2-cca0cd61.apk
          cp "$lunet_apk" out/Lunet-P5-4-v2-cca0cd61-arm64.apk

          echo "6d39d6bcdc283c84fc7bc6ea0b6fc83805a0845eefa915740c86422a7fcf7151  out/Ecosystem-Hub-P5-4-v2-cca0cd61.apk" | sha256sum -c -
          echo "f8d87d05e4e88099282498faa4212cbc0db9ed9272152ed593492cbf0efd06ad  out/Lunet-P5-4-v2-cca0cd61-arm64.apk" | sha256sum -c -
          sha256sum out/*.apk > out/SHA256SUMS.txt

      - name: Publicar pre-release DEVICE v2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: p5-4-device-v2-cca0cd61
          TARGET: cca0cd61d3776ae0dc2e4085a3e4488524937939
        run: |
          set -euo pipefail

          cat > notes.md <<'EOF'
          # P5-4 DEVICE v2 — Hub + Lunet

          Candidato corrigido após a falha DEVICE do candidato `b001eafd`.

          Commit testado: `cca0cd61d3776ae0dc2e4085a3e4488524937939` (PR #222).

          Correções principais:
          - Android Keystore usa `KeyStore.PrivateKeyEntry` para assinatura;
          - Lunet executa self-test ECDSA antes da sessão;
          - falhas agora indicam a etapa sanitizada (`challenge.sign`, `challenge.rpc`, `session.open.*`, `discover`, `invoke`);
          - nenhuma stack trace, segredo ou conteúdo privado é exposto.

          Evidência CI:
          - Hub Core + Hub APK: verdes;
          - Lunet: 321/321 + APK verde;
          - consistency: checks + self-test + simulação do integrador verdes;
          - Lunet versionCode: 1000083.

          IMPORTANTE: instale por cima dos apps atuais. Não revogue, não use “Esquecer conexão”, não limpe dados e não desinstale antes do primeiro reteste; queremos preservar o pareamento que falhou para validar a correção sobre o mesmo estado.

          O candidato anterior `p5-4-device-b001eafd` está superseded e não deve mais ser usado.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG"               out/Ecosystem-Hub-P5-4-v2-cca0cd61.apk               out/Lunet-P5-4-v2-cca0cd61-arm64.apk               out/SHA256SUMS.txt               --target "$TARGET"               --prerelease               --latest=false               --title "P5-4 DEVICE v2 — Hub + Lunet cca0cd61"               --notes-file notes.md
          fi

          if gh release view p5-4-device-b001eafd >/dev/null 2>&1; then
            gh release edit p5-4-device-b001eafd               --notes "SUPERSEDED — NÃO USAR PARA O RETESTE. O candidato b001eafd falhou no DEVICE após o pareamento. Use a pre-release p5-4-device-v2-cca0cd61."
          fi
