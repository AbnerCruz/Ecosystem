name: atlas-forge-proposal
on:
  pull_request:
    paths:
      - 'docs/proposals/atlas-forge/**'
      - '.github/workflows/atlas-forge-checks.yml'
  push:
    branches: [main]
    paths:
      - 'docs/proposals/atlas-forge/**'
      - '.github/workflows/atlas-forge-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/proposals/atlas-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/proposals/atlas-forge/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run benchmark > test-results/benchmark.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-forge-proposal-preview
          path: |
            docs/proposals/atlas-forge/dist/
            docs/proposals/atlas-forge/test-results/
          retention-days: 14
