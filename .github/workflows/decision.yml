name: decision

# Registra no repositório a decisão que o proprietário escolheu no portal (ADR-0007, DEC-0010) e o resultado da
# validação humana que aprovou ou reprovou nele (ADR-0008, ADD-0005).
# O portal abre uma Issue já preenchida; ENVIAR a Issue é a confirmação. Só o dono do repositório é aceito.
# Segurança: o texto da Issue nunca é interpolado em script (só chega por 'env'); o aplicador compara o texto com
# decisions.json de forma estrita; os checks de consistência rodam antes de qualquer gravação.

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: decision-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  record:
    name: Registrar decisão do proprietário
    if: github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, 'Decisão DEC-') || startsWith(github.event.issue.title, 'Validação '))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
      REPO_OWNER: ${{ github.repository_owner }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RESULT_FILE: /tmp/decision-result.md
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Aplicar a decisão
        id: apply
        run: |
          set +e
          dotnet run .github/scripts/apply-decision.cs
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Conferir consistência antes de gravar
        id: verify
        if: steps.apply.outputs.code == '0' && steps.apply.outputs.outcome == 'registered'
        run: |
          set +e
          dotnet run tests/consistency/Check.cs > /tmp/check.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ]; then
            git checkout -- .
            git clean -fdq docs/governance/responses docs/validation
            {
              echo '**Registro não efetuado.** O repositório ficaria inconsistente com esta decisão; nada foi alterado.'
              echo
              echo '```'
              tail -n 30 /tmp/check.log
              echo '```'
            } > /tmp/decision-result.md
          fi

      - name: Gravar no repositório
        id: push
        if: steps.apply.outputs.code == '0' && steps.apply.outputs.outcome == 'registered' && steps.verify.outputs.code == '0'
        env:
          COMMIT_MESSAGE: ${{ steps.apply.outputs.commit_message }}
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/governance docs/validation
          if ! git commit -q -m "${COMMIT_MESSAGE}"; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo '**Registro não efetuado.** A criação do commit falhou.' > /tmp/decision-result.md
            exit 0
          fi
          pushed=false
          for i in $(seq 1 12); do
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then pushed=true; break; fi
            git pull -q --rebase origin "${DEFAULT_BRANCH}"
          done
          echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
          if [ "$pushed" != "true" ]; then
            echo '**Registro não efetuado.** Não foi possível gravar no repositório (o push falhou três vezes). Nada foi alterado na branch padrão.' > /tmp/decision-result.md
          fi

      - name: Republicar o portal
        if: steps.push.outputs.pushed == 'true' || (steps.apply.outputs.code == '0' && steps.apply.outputs.outcome == 'already-registered')
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"

      # Veredito: o workflow só termina verde quando o resultado desejado existe no repositório (registrado agora, ou já
      # registrado com a mesma escolha). Recusa, erro, falha de consistência ou de push => falha (vermelho), com a causa
      # na Issue. A regra vive em decision-verdict.sh (testada pelo self-test), não em texto de stdout.
      - name: Responder na Issue, encerrá-la e dar o veredito
        if: always()
        env:
          APPLY_CODE: ${{ steps.apply.outputs.code }}
          OUTCOME: ${{ steps.apply.outputs.outcome }}
          VERIFY_CODE: ${{ steps.verify.outputs.code }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          bash .github/scripts/decision-verdict.sh > /tmp/verdict.txt
          verdict_code=$?
          reason=$(sed -n 's/^reason=//p' /tmp/verdict.txt)
          if [ ! -s /tmp/decision-result.md ]; then
            echo '**Registro não efetuado.** A automação falhou antes de produzir um resultado.' > /tmp/decision-result.md
          fi
          if [ "$verdict_code" != "0" ]; then
            {
              echo
              echo "**Esta resposta NÃO foi registrada** e a execução do workflow termina em falha de propósito. Corrija a causa acima (ou reabra a escolha no portal) e envie de novo. Execução: $RUN_URL"
            } >> /tmp/decision-result.md
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/decision-result.md
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "$reason"
          exit "$verdict_code"
