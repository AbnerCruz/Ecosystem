name: rpg-sonhos-ci

on:
  pull_request:
    paths:
      - 'apps/lunet2d/samples/rpg-dos-sonhos/**'
      - 'apps/lunet2d/tests/Lunet.Tests/RpgSonhosSliceTests.cs'
      - 'apps/lunet2d/tools/ci-rpg-sonhos.sh'
      - '.github/workflows/rpg-sonhos-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Compile only the game with the Lunet template
        working-directory: apps/lunet2d
        run: dotnet build runtime-template/Lunet.GameCode.csproj -c Debug -p:GameSourceRoot="$PWD/samples/rpg-dos-sonhos"
      - name: Build ARM64 game APK and portable project ZIP
        working-directory: apps/lunet2d
        run: |
          dotnet build runtime-template/Lunet.Game.Android.csproj -c Debug -p:AndroidSdkDirectory="$ANDROID_HOME" -p:GameSourceRoot="$PWD/samples/rpg-dos-sonhos" -p:ApplicationId="io.lunet.rpgsonhos.test${{ github.run_id }}" -p:ApplicationTitle=RpgSonhos
          mkdir -p dist/rpg-sonhos
          cp runtime-template/bin/Debug/net10.0-android/android-arm64/*-Signed.apk dist/rpg-sonhos/RPG-dos-Sonhos-arm64.apk
          (cd samples/rpg-dos-sonhos && zip -r ../../dist/rpg-sonhos/RPG-dos-Sonhos-Lunet.zip .)
      - name: Build x86_64 APK for emulated runtime smoke
        working-directory: apps/lunet2d
        run: |
          dotnet build runtime-template/Lunet.Game.Android.csproj -c Debug -p:RuntimeIdentifier=android-x64 -p:AndroidSdkDirectory="$ANDROID_HOME" -p:GameSourceRoot="$PWD/samples/rpg-dos-sonhos" -p:ApplicationId="io.lunet.rpgsonhos.test${{ github.run_id }}" -p:ApplicationTitle=RpgSonhos
          cp runtime-template/bin/Debug/net10.0-android/android-x64/*-Signed.apk dist/rpg-sonhos/emulator.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, boot, pause and capture the actual Lunet game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          script: bash apps/lunet2d/tools/ci-rpg-sonhos.sh io.lunet.rpgsonhos.test${{ github.run_id }}
      - name: Checksums
        if: always()
        working-directory: apps/lunet2d/dist/rpg-sonhos
        run: sha256sum RPG-dos-Sonhos-arm64.apk RPG-dos-Sonhos-Lunet.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rpg-sonhos-slice1
          path: apps/lunet2d/dist/rpg-sonhos/*
          if-no-files-found: error
