name: integrate

# Integrador automático (ADR-0015, ADD-0012): leva à main o trabalho dos agentes sem que ninguém precise verificá-lo à mão.
# Para um PR pronto por execução (não rascunho, da própria base, com handoff), monta o estado combinado com a main ATUAL, classifica
# a mudança com a política e as regras DA MAIN (rotina × crítico; docs/governance/integration-policy.json), roda nele os checks da main
# (checker confiável) e os do próprio candidato + o CI de cada Product tocado (workflows reutilizáveis). Rotina verde: integra sozinha,
# empurrando para a main exatamente o commit testado, sem force. Crítico verde: explica a consequência no PR e espera a label de
# autorização posta pelo proprietário (o autor do evento é conferido). Conflito ou check vermelho: volta ao agente autor.
# Antes de integrar, confere de novo: head do PR, ref de integração == commit testado, main == main testada.
# Segurança: pull_request_target roda a definição da main; o código do PR só roda nos jobs de checks, com permissão de leitura;
# PRs de fork e do Dependabot são ignorados; texto do PR só entra em script via variável de ambiente.

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrate
  cancel-in-progress: false

jobs:
  plan:
    name: Planejar e montar o estado combinado
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
    outputs:
      action: ${{ steps.prepare.outputs.action || steps.plan.outputs.action }}
      outcome: ${{ steps.prepare.outputs.outcome }}
      conflicts: ${{ steps.prepare.outputs.conflicts }}
      pr: ${{ steps.plan.outputs.pr }}
      head: ${{ steps.plan.outputs.head }}
      main: ${{ steps.plan.outputs.main }}
      authorized: ${{ steps.plan.outputs.authorized }}
      more: ${{ steps.plan.outputs.more }}
      combined: ${{ steps.prepare.outputs.combined || steps.plan.outputs.tested_combined }}
      products: ${{ steps.prepare.outputs.products || '[]' }}
      criticality: ${{ steps.prepare.outputs.criticality || steps.plan.outputs.tested_criticality }}
      requires_owner: ${{ steps.prepare.outputs.requires_owner || (steps.plan.outputs.action == 'land' && 'true') || '' }}
      critical_classes: ${{ steps.prepare.outputs.critical_classes }}
      critical_reason: ${{ steps.prepare.outputs.critical_reason }}
      handoffs: ${{ steps.prepare.outputs.handoffs }}
      trusted: ${{ steps.prepare.outputs.trusted }}
      trusted_failures: ${{ steps.prepare.outputs.trusted_failures }}
      gate_reason: ${{ steps.prepare.outputs.gate_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0
          path: trusted
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Coletar PRs abertos e o estado de integração de cada um
        working-directory: trusted
        run: bash .github/integrator/integrate.sh collect > /tmp/integration-input.json && cat /tmp/integration-input.json
      - name: Decidir (lógica testada pelo self-test)
        id: plan
        working-directory: trusted
        run: dotnet run tests/consistency/Check.cs -- --integration-plan --input /tmp/integration-input.json --policy docs/governance/integration-policy.json | grep -E '^[a-z_]+=' | tee -a "$GITHUB_OUTPUT"
      - name: Montar o estado combinado (main atual + PR), classificar e rodar o checker confiável da main
        id: prepare
        if: steps.plan.outputs.action == 'evaluate'
        working-directory: trusted
        env:
          PR: ${{ steps.plan.outputs.pr }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
          MAIN: ${{ steps.plan.outputs.main }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/integrator/integrate.sh prepare

  consistency:
    name: Checks do Ecosystem no estado combinado
    needs: plan
    if: needs.plan.outputs.action == 'evaluate'
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/consistency.yml
    with:
      ref: ${{ needs.plan.outputs.combined }}

  urbe:
    name: CI do Urbe no estado combinado
    needs: plan
    if: needs.plan.outputs.action == 'evaluate' && contains(fromJSON(needs.plan.outputs.products), 'urbe')
    permissions:
      contents: read
    uses: ./.github/workflows/urbe-checks.yml
    with:
      ref: ${{ needs.plan.outputs.combined }}

  lunet2d:
    name: CI do Lunet2D no estado combinado
    needs: plan
    if: needs.plan.outputs.action == 'evaluate' && contains(fromJSON(needs.plan.outputs.products), 'lunet2d')
    permissions:
      contents: read
    uses: ./.github/workflows/lunet2d-ci.yml
    with:
      ref: ${{ needs.plan.outputs.combined }}

  hub:
    name: CI do Hub no estado combinado
    needs: plan
    if: needs.plan.outputs.action == 'evaluate' && contains(fromJSON(needs.plan.outputs.products), 'hub')
    permissions:
      contents: read
    uses: ./.github/workflows/hub-ci.yml
    with:
      ref: ${{ needs.plan.outputs.combined }}

  ecosystem-ai:
    name: CI do Ecosystem AI no estado combinado
    needs: plan
    if: needs.plan.outputs.action == 'evaluate' && contains(fromJSON(needs.plan.outputs.products), 'ecosystem-ai')
    permissions:
      contents: read
    uses: ./.github/workflows/ecosystem-ai-ci.yml
    with:
      ref: ${{ needs.plan.outputs.combined }}

  tabletop-rpg:
    name: CI do Tabletop RPG no estado combinado
    needs: plan
    if: needs.plan.outputs.action == 'evaluate' && contains(fromJSON(needs.plan.outputs.products), 'tabletop-rpg')
    permissions:
      contents: read
    uses: ./.github/workflows/tabletop-rpg-ci.yml
    with:
      ref: ${{ needs.plan.outputs.combined }}

  math-authoring:
    name: CI do Math Authoring no estado combinado
    needs: plan
    if: needs.plan.outputs.action == 'evaluate' && contains(fromJSON(needs.plan.outputs.products), 'math-authoring')
    permissions:
      contents: read
    uses: ./.github/workflows/math-authoring-ci.yml
    with:
      ref: ${{ needs.plan.outputs.combined }}

  finish:
    name: Integrar, marcar pronto ou devolver ao autor
    needs: [plan, consistency, urbe, lunet2d, hub, ecosystem-ai, tabletop-rpg, math-authoring]
    if: always() && needs.plan.result == 'success' && contains(fromJSON('["evaluate","land","blocked"]'), needs.plan.outputs.action)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ACTION: ${{ needs.plan.outputs.action }}
      OUTCOME: ${{ needs.plan.outputs.outcome }}
      CONFLICTS: ${{ needs.plan.outputs.conflicts }}
      PR: ${{ needs.plan.outputs.pr }}
      HEAD_SHA: ${{ needs.plan.outputs.head }}
      MAIN: ${{ needs.plan.outputs.main }}
      AUTHORIZED: ${{ needs.plan.outputs.authorized }}
      MORE: ${{ needs.plan.outputs.more }}
      COMBINED: ${{ needs.plan.outputs.combined }}
      CRITICALITY: ${{ needs.plan.outputs.criticality }}
      REQUIRES_OWNER: ${{ needs.plan.outputs.requires_owner }}
      CRITICAL_CLASSES: ${{ needs.plan.outputs.critical_classes }}
      CRITICAL_REASON: ${{ needs.plan.outputs.critical_reason }}
      HANDOFFS: ${{ needs.plan.outputs.handoffs }}
      TRUSTED: ${{ needs.plan.outputs.trusted }}
      TRUSTED_FAILURES: ${{ needs.plan.outputs.trusted_failures }}
      GATE_REASON: ${{ needs.plan.outputs.gate_reason }}
      R_CONSISTENCY: ${{ needs.consistency.result }}
      R_URBE: ${{ needs.urbe.result }}
      R_LUNET2D: ${{ needs.lunet2d.result }}
      R_HUB: ${{ needs.hub.result }}
      R_ECOSYSTEM_AI: ${{ needs.ecosystem-ai.result }}
      R_TABLETOP_RPG: ${{ needs.tabletop-rpg.result }}
      R_MATH_AUTHORING: ${{ needs.math-authoring.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Aplicar o veredito
        run: bash .github/integrator/integrate.sh finish
