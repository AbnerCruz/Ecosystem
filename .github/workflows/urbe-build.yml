name: urbe-build

# Workflow reutilizável (REQ-006, REQ-066): só constrói e envia os artefatos. Quem publica é o release.yml.
# O canal beta direto do Urbe usa uma chave de desenvolvimento PÚBLICA e estável versionada em
# apps/urbe/tools (DEC-0039). Instalações legadas migram por backup + reinstalação deliberada.

on:
  workflow_call:
    inputs:
      version:
        description: 'Versão do package.json (usada no nome do APK)'
        type: string
        required: true
      release:
        description: 'Build destinado a publicação'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/urbe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/urbe/package-lock.json
      - run: npm ci
      - name: Instalador (NSIS)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/urbe/dist/*.exe
            apps/urbe/dist/*.exe.blockmap
            apps/urbe/dist/latest.yml
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/urbe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/urbe/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: App web para o Android
        run: node tools/build-www.mjs && npx cap sync android
      - name: Assinatura estável do canal beta
        run: |
          set -euo pipefail
          (cd tools && sha256sum -c urbe-dev.keystore.sha256)
          expected="$(tr -d '[:space:]' < tools/urbe-dev.certificate.sha256)"
          actual="$(keytool -list -v -keystore tools/urbe-dev.keystore -storepass urbe-dev -alias urbe | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)"
          [ "$actual" = "$expected" ] || {
            echo "::error::Certificado inesperado na chave dev do Urbe: $actual"
            exit 1
          }
          echo "URBE_KEYSTORE=$GITHUB_WORKSPACE/apps/urbe/tools/urbe-dev.keystore" >> "$GITHUB_ENV"
          echo "URBE_KEYSTORE_PASSWORD=urbe-dev" >> "$GITHUB_ENV"
          echo "URBE_KEY_ALIAS=urbe" >> "$GITHUB_ENV"
          echo "URBE_KEY_PASSWORD=urbe-dev" >> "$GITHUB_ENV"
          echo "Urbe beta certificate SHA-256: $actual"
      - name: APK
        working-directory: apps/urbe/native/android
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace
      - name: Conferir assinatura e nome do arquivo
        run: |
          set -euo pipefail
          apk="native/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          expected="$(tr -d '[:space:]' < tools/urbe-dev.certificate.sha256 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner" || { echo "::error::apksigner não encontrado"; exit 1; }
          cert_output="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)"
          printf '%s\n' "$cert_output"
          actual="$(printf '%s\n' "$cert_output" | grep -im1 'certificate SHA-256 digest:' | sed 's/.*: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          [ -n "$actual" ] && [ "$actual" = "$expected" ] || {
            echo "::error::APK não está assinado com a identidade beta canônica do Urbe (esperado=$expected atual=${actual:-ausente})"
            exit 1
          }
          mkdir -p out
          cp "$apk" "out/Urbe-${{ inputs.version }}.apk"
          (cd out && sha256sum "Urbe-${{ inputs.version }}.apk" > "Urbe-${{ inputs.version }}.apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            apps/urbe/out/*.apk
            apps/urbe/out/*.sha256
          if-no-files-found: error
