name: urbe-checks

# Legado JS continua com seus checks; C# usa Core + cliente nativo (Avalonia) em Android/Windows, sem Web/PWA.
# A casca Blazor/MAUI congelada (Urbe.UI/Urbe.App/Urbe.Web) sai com a simulação (ADD-0028, UC-34): não é mais compilada aqui.
# Releases Android C#: urbe-csharp-mobile-release.yml.

on:
  push:
    branches: [main]
    paths: ['apps/urbe/**', '.github/workflows/urbe-checks.yml']
  pull_request:
    paths: ['apps/urbe/**', '.github/workflows/urbe-checks.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit a testar (o integrador passa o estado combinado main + PR; ADR-0015)'
        type: string
        required: false
        default: ''

concurrency:
  group: urbe-checks-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/urbe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/urbe/package-lock.json
      - run: npm ci
      - run: npm run check

  # E2E em Chromium real (RM-F2-02): o harness de produção do monólito só conta como gate quando roda aqui.
  # Escopo deliberado: os cenários já provados em Chromium (harness, ZIP e smoke); os demais E2E entram um a um.
  e2e:
    # Playwright 1.56 does not install Chromium on ubuntu-latest = 26.04 (since 21/10/2026): pinned to 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/urbe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/urbe/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/run-e2e.mjs app-runtime zip smoke import

  csharp-portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/urbe/csharp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Urbe.Portable.slnx
      - run: dotnet build Urbe.Portable.slnx -c Release --no-restore
      - run: dotnet test --project tests/Urbe.Core.Tests -c Release --no-build
      # DEC-0043 / ADR-0032 (UC-33): native client, headless Skia rendering; frames kept as review evidence.
      - run: dotnet test --project tests/Urbe.Client.Tests -c Release --no-build
        env:
          URBE_SNAPSHOT_DIR: ${{ github.workspace }}/apps/urbe/csharp/artifacts/native-snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: urbe-native-client-snapshots
          path: apps/urbe/csharp/artifacts/native-snapshots
          if-no-files-found: warn
          retention-days: 14

  # DEC-0043 / ADR-0032 (UC-33, gate G-N0): native client without WebView on Android and Windows.
  # Preview artifacts for the owner's device test only; never signed for a channel, never published.
  android-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/urbe/csharp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet workload install android
      - name: Build isolated emulator preview (not the signed beta channel)
        run: dotnet publish src/Urbe.Android/Urbe.Android.csproj -c Debug -p:RuntimeIdentifiers=android-x64 -p:EmbedAssembliesIntoApk=true -o artifacts/emulator
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and resume the actual Android application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p apps/urbe/csharp/artifacts/android-smoke
            adb install -r "$(find apps/urbe/csharp/artifacts/emulator -name '*-Signed.apk' | head -1)"
            adb logcat -c
            adb shell monkey -p app.urbe.nativepreview -c android.intent.category.LAUNCHER 1
            sleep 10
            pid=$(adb shell pidof app.urbe.nativepreview | tr -d '\r')
            test -n "$pid"
            adb exec-out screencap -p > apps/urbe/csharp/artifacts/android-smoke/launched.png
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell monkey -p app.urbe.nativepreview -c android.intent.category.LAUNCHER 1
            sleep 5
            test -n "$(adb shell pidof app.urbe.nativepreview)"
            adb logcat -d --pid="$pid" > apps/urbe/csharp/artifacts/android-smoke/logcat.txt
            adb exec-out screencap -p > apps/urbe/csharp/artifacts/android-smoke/resumed.png
            if grep -E 'FATAL EXCEPTION|Fatal signal|ANR in app.urbe' apps/urbe/csharp/artifacts/android-smoke/logcat.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: urbe-android-runtime-smoke
          path: apps/urbe/csharp/artifacts/android-smoke
          if-no-files-found: warn
          retention-days: 14

  csharp-client-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/urbe/csharp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v6
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.target == 'android'
        run: dotnet workload install android
      - name: Package native Android preview APK
        if: matrix.target == 'android'
        run: |
          dotnet publish src/Urbe.Android/Urbe.Android.csproj -c Release -p:AndroidPackageFormat=apk -p:AndroidCreatePackagePerAbi=false -o artifacts/native-android
          mkdir -p artifacts/native-preview
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          apks = sorted(Path("artifacts/native-android").rglob("*-Signed.apk")) or sorted(Path("artifacts/native-android").rglob("*.apk"))
          if not apks:
              raise SystemExit("ERROR: .NET Android did not produce an APK")
          out = Path("artifacts/native-preview/Urbe-Nativo-Previa.apk")
          shutil.copy2(apks[-1], out)
          print(f"APK de prévia: {apks[-1]} -> {out} ({out.stat().st_size} bytes)")
          PY
      - name: Package native Windows preview
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          dotnet publish src/Urbe.Desktop/Urbe.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/native-windows
          New-Item -ItemType Directory -Force artifacts/native-preview | Out-Null
          Compress-Archive -Path artifacts/native-windows/* -DestinationPath artifacts/native-preview/Urbe-Nativo-Previa-Windows.zip
      - name: Test editor and publications on Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          dotnet build tests/Urbe.Core.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/Urbe.Core.Tests/bin/Release/net10.0/Urbe.Core.Tests.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/Urbe.Client.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/Urbe.Client.Tests/bin/Release/net10.0/Urbe.Client.Tests.dll -class '*NoteProgressUiTests' -class '*PublicationCompositionTests' -class '*EditorNewlineUiTests'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/Urbe.Client.Tests/bin/Release/net10.0/Urbe.Client.Tests.dll -method '*EditorLineNumbersFollow*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: urbe-native-preview-${{ matrix.target }}
          path: apps/urbe/csharp/artifacts/native-preview
          if-no-files-found: error
          retention-days: 14
