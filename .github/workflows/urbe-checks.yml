name: urbe-checks

# Checagens do Urbe no monorepo: só `npm run check`, sem builds de Windows/Android, sem assinatura e sem publicar.
# Roda apenas quando o produto muda (NN-014). Releases e builds assinados continuam na origem (DEC-0008-A; plano §7).

on:
  push:
    branches: [main]
    paths: ['apps/urbe/**', '.github/workflows/urbe-checks.yml']
  pull_request:
    paths: ['apps/urbe/**', '.github/workflows/urbe-checks.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit a testar (o integrador passa o estado combinado main + PR; ADR-0015)'
        type: string
        required: false
        default: ''

concurrency:
  group: urbe-checks-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/urbe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/urbe/package-lock.json
      - run: npm ci
      - run: npm run check

  # E2E em Chromium real (RM-F2-02): o harness de produção do monólito só conta como gate quando roda aqui.
  # Escopo deliberado: os cenários já provados em Chromium (harness, ZIP e smoke); os demais E2E entram um a um.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/urbe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/urbe/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/run-e2e.mjs app-runtime zip smoke
