name: consistency

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit a testar (o integrador passa o estado combinado main + PR; ADR-0015)'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  issues: read

jobs:
  consistency:
    name: Foundation consistency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Instantâneo das Issues (ROADMAP × Issues, DEC-0003)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/data
          gh issue list --state all --limit 500 --json number,title,state,labels > site/data/issues-snapshot.json
      - name: Consistency checks
        run: dotnet run tests/consistency/Check.cs
      - name: P6-4 real Lunet Host + Agent Workspace pilot (test-only, two Products)
        run: dotnet run --project tests/integration/p6-lunet-host/P6LunetHost.csproj
      - name: Self-test (each check detects its violation)
        run: dotnet run tests/consistency/Check.cs -- --self-test
      - name: Simulação do integrador (ADR-0015; git local, sem GitHub)
        run: bash .github/integrator/simulate.sh
