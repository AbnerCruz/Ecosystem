name: urbe-cutover

# P4-9 / DEC-0039: corte DIRETO. Não existe mais etapa legacy-bridge nem sincronização
# com AbnerCruz/Urbe. O proprietário inicia explicitamente pelo workflow_dispatch.
# O workflow cria urbe-v<versão> no commit atual da main e dispara urbe-release.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão exata de apps/urbe/package.json (ex. 1.8.3-beta)
        type: string
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: urbe-cutover
  cancel-in-progress: false

jobs:
  tag:
    name: Validar e criar tag direta do Urbe
    runs-on: ubuntu-latest
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar pedido contra o Product canônico
        id: prepare
        run: |
          set -euo pipefail
          case "$REQUESTED_VERSION" in
            ''|*[!0-9A-Za-z.-]*) echo "::error::Versão inválida"; exit 1 ;;
          esac

          target="$(git rev-parse HEAD)"
          current="$(node -p "require('./apps/urbe/package.json').version")"
          [ "$REQUESTED_VERSION" = "$current" ] || {
            echo "::error::Versão solicitada $REQUESTED_VERSION difere de apps/urbe/package.json ($current)"
            exit 1
          }

          node <<'NODE'
          const p = require('./apps/urbe/package.json');
          const cfg = p.build?.publish?.[0];
          if (!cfg || cfg.provider !== 'github' || cfg.owner !== 'AbnerCruz' || cfg.repo !== 'Ecosystem' || cfg.tagNamePrefix !== 'urbe-v') {
            throw new Error('package.json não contém a configuração canônica para releases diretas');
          }
          NODE

          tag="urbe-v$REQUESTED_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/tmp/existing-tag 2>/dev/null; then
            remote_sha="$(cut -f1 /tmp/existing-tag | head -n1)"
            [ "$remote_sha" = "$target" ] || {
              echo "::error::Tag $tag já existe em outro commit ($remote_sha)"
              exit 1
            }
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Criar tag imutável no commit canônico
        if: steps.prepare.outputs.already != 'true'
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TARGET="${{ steps.prepare.outputs.sha }}"
          git tag "$TAG" "$TARGET"
          git push origin "refs/tags/$TAG"

      - name: Disparar release direto
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run urbe-release.yml --ref "$TAG"

      - name: Resumo
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
          SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          {
            echo "## Urbe P4-9 — corte direto"
            echo
            printf -- '- versão: `%s`\n' "$REQUESTED_VERSION"
            printf -- '- tag: `%s`\n' "$TAG"
            printf -- '- commit: `%s`\n' "$SHA"
            echo "- canal legado/sync: abandonado por DEC-0039"
            printf '%s\n' '- `urbe-release.yml` foi disparado sobre a tag direta.'
          } >> "$GITHUB_STEP_SUMMARY"
