name: urbe-csharp-mobile-release
# ART-1: re-run beta.7 after C# expression compile fix; no prior tag was published.

# UC-25/UC-27 — Urbe 2 native Android beta releases only; desktop is later.
# No WASM, Pages or JS product is distributed by this workflow.
# DEC-0048 / ADD-0025 ("Urbe Beta 2.0"): from 2.0.0-beta.10 this channel publishes the NATIVE client
# (Avalonia, src/Urbe.Android, DEC-0043/ADR-0032); the frozen Blazor UI (Urbe.App) is no longer published.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/urbe-csharp-mobile-release.yml'
      - 'apps/urbe/csharp/src/Urbe.Android/Urbe.Android.csproj'
  workflow_dispatch:

concurrency:
  group: urbe-csharp-mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        working-directory: apps/urbe/csharp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify canonical Android version and beta signing key
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import os, re
          root = ET.parse('src/Urbe.Android/Urbe.Android.csproj').getroot()
          beta = next(g for g in root.iter('PropertyGroup') if "'$(UrbeChannel)' == 'beta'" in (g.get('Condition') or ''))
          assert beta.findtext('ApplicationId') == 'app.urbe.csharp', 'Identidade Android alterada'
          version = root.findtext('.//UrbeBetaVersion')
          code = int(root.findtext('.//UrbeBetaVersionCode'))
          assert re.fullmatch(r'\d+\.\d+\.\d+-beta\.\d+', version), version
          assert code >= 2000001, code
          tag = 'urbe-csharp-v' + version
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\nversion_code={code}\ntag={tag}\n')
          print(f'Urbe C# {version} / versionCode {code} / {tag}')
          PY
          (cd ../tools && sha256sum -c urbe-dev.keystore.sha256)
          tag="urbe-csharp-v$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('src/Urbe.Android/Urbe.Android.csproj').getroot()
          print(root.findtext('.//UrbeBetaVersion'))
          PY
          )"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Esta versão já foi publicada; tags/releases existentes são imutáveis."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test C# Core
        if: steps.version.outputs.skip != 'true'
        run: dotnet test --project tests/Urbe.Core.Tests -c Release

      - name: Install Android workload
        if: steps.version.outputs.skip != 'true'
        run: dotnet workload install android

      - name: Build and sign Android beta APK
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE: ${{ github.workspace }}/apps/urbe/tools/urbe-dev.keystore
        run: |
          set -euo pipefail
          dotnet publish src/Urbe.Android/Urbe.Android.csproj \
            -c Release \
            -p:UrbeChannel=beta \
            -p:AndroidPackageFormat=apk \
            -p:AndroidCreatePackagePerAbi=false \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$KEYSTORE" \
            -p:AndroidSigningStorePass=urbe-dev \
            -p:AndroidSigningKeyAlias=urbe \
            -p:AndroidSigningKeyPass=urbe-dev

      - name: Verify artifact and stable beta certificate
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil
          p = Path('src/Urbe.Android/bin/Release/net10.0-android')
          signed = sorted((p / 'publish').glob('*-Signed.apk'))
          if not signed:
              signed = sorted(p.glob('*-Signed.apk'))
          if len(signed) != 1:
              raise SystemExit(f'Expected one published, signed APK; found {signed}')
          out = Path('artifacts/mobile-release')
          out.mkdir(parents=True, exist_ok=True)
          dest = out / f'Urbe-CSharp-{os.environ["VERSION"]}-Android.apk'
          shutil.copy2(signed[0], dest)
          print(f'Signed Android APK: {dest} ({dest.stat().st_size} bytes)')
          PY
          apk="artifacts/mobile-release/Urbe-CSharp-$VERSION-Android.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee artifacts/mobile-release/cert-info.txt
          expected="$(tr -d '[:space:]' < ../tools/urbe-dev.certificate.sha256 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          actual="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$actual" && test "$expected" = "$actual" || { echo "::error::Invalid Android signing certificate"; exit 1; }
          rm artifacts/mobile-release/cert-info.txt
          (cd artifacts/mobile-release && sha256sum *.apk > SHA256SUMS.txt)

      - name: Verify the APK is the native client of the beta channel
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk="artifacts/mobile-release/Urbe-CSharp-$VERSION-Android.apk"
          # the .NET assemblies are packed in one store inside the APK; the native client is the one that ships Skia (Avalonia)
          unzip -l "$apk" | grep -q "libSkiaSharp.so" || { echo "::error::APK sem o cliente nativo (Avalonia/Skia)"; exit 1; }
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)"
          badging="$("$aapt" dump badging "$apk")"
          echo "$badging" | head -3
          echo "$badging" | grep -q "package: name='app.urbe.csharp'.*versionName='$VERSION'" || { echo "::error::Identidade ou versão erradas"; exit 1; }
          echo "$badging" | grep -q "application-label:'Urbe'" || { echo "::error::Nome do app errado"; exit 1; }

      - name: Preserve verified Android beta APK as workflow artifact
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: urbe-csharp-v${{ steps.version.outputs.version }}-android
          path: |
            apps/urbe/csharp/artifacts/mobile-release/Urbe-CSharp-${{ steps.version.outputs.version }}-Android.apk
            apps/urbe/csharp/artifacts/mobile-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish numbered Android prerelease, never a Web build
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > artifacts/mobile-release/release-notes.md <<'EOF'
          # Urbe Beta 2.0 — nativo ($VERSION, Android)

          Primeira beta do cliente nativo do Urbe: a cidade da 1.8.4 em tela cheia, com a interface sobreposta.
          Substitui, no mesmo canal (app.urbe.csharp), a interface anterior das betas 2.0 e atualiza no lugar.

          - cidade procedural: notas são casas, pastas são bairros, wikilinks são ruas; moradores, fauna, clima e eventos;
          - Explorer, editor Visual e Fonte, fórmulas, comentários e tags; estúdio de páginas; HTML, PDF, áudio e vídeo;
          - Assistente (IA) com o provedor que você conectar; plugins nativos (Relógio);
          - backup, exportação e restauração; lixeira e versões anteriores das notas.

          No Windows: baixe o Urbe-CSharp-$VERSION-Windows-x64.zip, extraia e abra o Urbe.exe (não precisa instalar nada).

          Faça backup antes de instalar. As notas ficam na pasta que você escolhe; pode ser preciso escolhê-la de novo.
          Beta: a validação no aparelho ainda está em andamento.

          O canal beta usa um certificado de desenvolvimento público e fixo para permitir atualizações da mesma família de APKs. Não é uma identidade de publicação privada.
          Commit de origem: __COMMIT_SHA__
          EOF
          # Markdown code ticks in release notes must never execute shell commands.
          sed -i -e "s/__COMMIT_SHA__/$SHA/g" \
            -e "s/\$VERSION/$VERSION/g" artifacts/mobile-release/release-notes.md
          gh release create "$TAG" \
            "artifacts/mobile-release/Urbe-CSharp-$VERSION-Android.apk" \
            "artifacts/mobile-release/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --prerelease --latest=false --title "Urbe Beta 2.0 — nativo ($VERSION)" \
            --notes-file artifacts/mobile-release/release-notes.md

  # Owner (15/10/2026): "Cadê o Urbe beta 2.0 desktop". The same native client for Windows (Urbe.Desktop,
  # self-contained, one Urbe.exe) attached to the same release; a release that already exists without it gets it
  # added (assets already there are never replaced).
  windows:
    needs: android
    if: always() && needs.android.result == 'success' && needs.android.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/urbe/csharp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Is the Windows build already in the release?
        id: need
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.android.outputs.tag }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          set -euo pipefail
          asset="Urbe-CSharp-$VERSION-Windows-x64.zip"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG não existe"; exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the Windows client (self-contained, one Urbe.exe)
        if: steps.need.outputs.skip != 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          dotnet publish src/Urbe.Desktop/Urbe.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/windows-release/Urbe
          if (-not (Test-Path artifacts/windows-release/Urbe/Urbe.exe)) { throw "Urbe.exe não foi gerado" }
          Compress-Archive -Path artifacts/windows-release/Urbe/* -DestinationPath "artifacts/windows-release/Urbe-CSharp-$env:VERSION-Windows-x64.zip"
          $hash = (Get-FileHash "artifacts/windows-release/Urbe-CSharp-$env:VERSION-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  Urbe-CSharp-$env:VERSION-Windows-x64.zip" | Out-File -Encoding ascii artifacts/windows-release/SHA256SUMS-Windows.txt

      - name: Attach to the release
        if: steps.need.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.android.outputs.tag }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "artifacts/windows-release/Urbe-CSharp-$VERSION-Windows-x64.zip" \
            "artifacts/windows-release/SHA256SUMS-Windows.txt" \
            --repo "$GITHUB_REPOSITORY"
