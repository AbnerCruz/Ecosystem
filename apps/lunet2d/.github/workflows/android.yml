name: Android foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build APK
        run: dotnet build src/Lunet.Android/Lunet.Android.csproj -c Debug -f net10.0-android -p:AndroidPackageFormat=apk -p:AndroidSdkDirectory="$ANDROID_HOME"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lunet-foundation-apk
          path: src/Lunet.Android/bin/Debug/net10.0-android/**/*.apk
          if-no-files-found: error
