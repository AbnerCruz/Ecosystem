name: Urbe structural checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax (todos os arquivos)
        run: |
          set -e
          for f in $(git ls-files '*.js'); do node --check "$f"; done
      - name: Tutorial em dia com as notas
        run: node tools/build-tutorial.mjs --check
      - name: Testes (todos os arquivos em tests/)
        run: |
          status=0
          for t in tests/*.mjs; do
            echo "::group::$t"
            node "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
