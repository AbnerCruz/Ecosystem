name: Urbe structural checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check src/legacy/bootstrap.js
          node --check src/core/core.js
          node --check src/core/documents.js
          node --check src/core/trash.js\n          node --check src/core/knowledge-index.js
          node --check src/persistence/workspace.js
          node --check src/world/projection.js
          node --check src/world/system.js
          node --check src/world/roads.js
          node --check src/world/renderer.js
          node --check src/world/touch.js
          node --check src/core/scheduler.js
          node --check src/burgo/projection.js
          node --check src/explorer/model.js
          node --check src/explorer/operations.js
          node --check src/explorer/mobile-ui.js
          node --check src/editor/session.js
          node --check src/editor/context.js
          node --check src/editor/workspace.js
          node --check src/editor/split.js
          node --check src/editor/split-ui.js
          node --check src/editor/find-ui.js
          node --check src/editor/chrome.js
          node --check src/core/keymap.js
          node --check src/ui/command-palette.js
          node --check src/ui/quick-open.js
          node --check src/app.js
          node --check sw.js
      - name: Structural invariants
        run: |
          node tests/static.mjs
          node tests/core.mjs
          node tests/documents.mjs\n          node tests/trash.mjs
          node tests/editor.mjs
          node tests/editor-workspace.mjs
          node tests/explorer.mjs
          node tests/persistence-world.mjs
          node tests/world-system.mjs
          node tests/runtime-adapters.mjs
          node tests/production-order.mjs
